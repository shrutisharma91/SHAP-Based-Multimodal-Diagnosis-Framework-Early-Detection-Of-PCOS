# Paths and hyperparameters for the PCOS multimodal pipeline.
seed: 42

paths:
  clinical_raw_dir: data/raw/clinical
  ultrasound_root: data/raw/ultrasound
  processed_dir: data/processed
  artifacts_dir: artifacts

clinical:
  target_col: PCOS
  test_size: 0.2
  cv_folds: 5
  feature_sets:
    - A_full
    - B_no_ultrasound
    - C_no_us_no_hcg
    - D_no_amh
  xgb:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    reg_lambda: 1.0
  rf:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 2
    max_features: sqrt

image:
  backbone: efficientnet_b0
  img_size: 224
  batch_size: 32
  epochs: 15
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 2

dedupe:
  phash_threshold: 6

shap:
  clinical_top_k: 15
  image_samples: 6
  image_nsamples: 200
  image_background: 64

fusion:
  strategy: stacking
